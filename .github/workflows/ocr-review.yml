name: OCR Review

# AI code review on every PR push, posted as inline comments plus one sticky
# summary. Runs automatically; findings are advisory, merge decisions stay
# human. Model traffic goes through the OCR_LLM_TOKEN secret (DeepSeek API).

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ocr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Fork PRs cannot read repo secrets, so ocr would fail on the empty token.
    # First-party branches get reviewed; forks are skipped explicitly.
    if: github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: OpenCodeReview
        uses: alibaba/open-code-review@375f64cd6f67a48a135da83cfcf59c52669a09cb # v1.13.3
        with:
          # Protocol: OpenAI-compatible (llm_use_anthropic: 'false').
          llm_url: https://api.deepseek.com
          llm_auth_token: ${{ secrets.OCR_LLM_TOKEN }}
          llm_model: deepseek-chat
          llm_use_anthropic: 'false'
          language: English
          effort: medium
          review_task_timeout: '15'
          review_concurrency: '4'
          # Inline comments for medium+ severity (routing below low), plus one
          # sticky summary per run. Incremental mode never deletes history.
          route_severity_below: low
          sticky_summary: 'true'
          incremental: 'true'
          resolve_outdated: 'false'
          checkpoint_range: 'false'
          # Live progress lines in the workflow log while runs are new.
          stream_progress: 'true'
