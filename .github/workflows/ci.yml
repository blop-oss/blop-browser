name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      - name: Check local documentation links
        run: bun run check:links

      - name: Check comparison evidence
        run: bun run check:comparison

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Tests (browser)
        run: |
          for test_file in test/browser/*.test.ts; do
            bun test "$test_file"
          done

      - name: Tests (benchmarks)
        run: bun test test/benchmarks

      - name: Tests (CLI)
        run: bun test test/cli

      - name: Tests (Docker session)
        run: bun test test/session

      - name: Verify npm package
        run: npm pack --dry-run
